<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banque</title>
    <link rel="stylesheet" href="media/css/style.css">
</head>
<body>
    <header>
        <div class="logo">Banque</div>
    </header>
    <h1>Tableau de Bord</h1>
    <section>
        <div>
            <div>
                <h5>total épargne</h5>
                <p>0.00 e</p>
            </div>
            <div class="green">icon</div>
        </div>
        <div>
            <div>
                <h5>total investissement</h5>
                <p>0.00 e</p>
            </div>
            <div class="blue">icon</div>
        </div>
        <div>
            <div>
                <h5>total general</h5>
                <p>0.00 e</p>
            </div>
            <div class="orange">icon</div>
        </div>
    </section>

    <section>
        <h2>Ajouter une transaction</h2>
        <form action="" method="POST" id="insertTransaction">
            <div>
                <label for="category">Type</label>
                <select name="category" id="category">
                    <option value="">Choisissez un type</option>
                    <option value="1">Dépôt</option>
                    <option value="2">Retrait</option>
                </select>
            </div>
            <div>
                <label for="amount">Montant (e)</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01" min="0">
            </div>
            <div>
                <label>Catégorie</label>
                <div class="switch-container">
                    <span class="switch-label" id="typeLabel">épargne</span>
                    <label class="switch">
                        <input type="checkbox" id="typeSwitch">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div>
                <label for="transactionDate">Date</label>
                <input type="date" id="transactionDate">
            </div>
            <button>Insérer</button>
        </form>
        <div id="explication"></div>
    </section>

    <section>
        <h2>Transactions récentes</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Catégorie</th>
                    <th>Dépot</th>
                    <th>Montant</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>xxx</td>
                    <td>xxx</td>
                    <td>xxx</td>
                    <td>xxx</td>
                    <td>
                        <button title="Modifier">M</button>
                        <button title="Supprimer">S</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>


    <script src="media/js/script.js"></script>
    <script src="media/js/insert-transaction.js"></script>
    
</body>
</html>
